<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --border: #e5e2dc;
        --text: #2b2926;
        --muted: #6b675f;
        --accent: #1a6b54;
      }
      html.dark {
        --bg: #202328;
        --border: #3a3f46;
        --text: #eceeef;
        --muted: #a7adb5;
        --accent: #4ec9a0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px;
        background: transparent;
        color: var(--text);
        font:
          14px/1.5 "Noto Sans SC",
          system-ui,
          sans-serif;
      }
      main {
        max-width: 900px;
        margin: auto;
        padding: 15px;
        border: 1px solid var(--border);
        background: var(--bg);
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 14px;
      }
      h2 {
        margin: 0;
        font-size: 17px;
      }
      #total {
        color: var(--muted);
      }
      .tracks {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .track {
        min-width: 0;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 5px;
      }
      .bar {
        height: 8px;
        overflow: hidden;
        background: var(--border);
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      small {
        color: var(--muted);
      }
      @media (max-width: 620px) {
        .tracks {
          grid-template-columns: 1fr;
          gap: 10px;
        }
        main {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h2>本机学习进度</h2>
        <span id="total"></span>
      </header>
      <div id="tracks" class="tracks"></div>
      <small>进度只保存在当前浏览器，不会上传或跨设备同步。</small>
    </main>
    <script type="module">
      import { lessons } from "./manifest.js"
      import { readProgress } from "./progress.js"
      const names = { python: "Python 与数据", sql: "SQL", web: "Web 开发" }
      const groups = lessons.reduce((result, lesson) => {
        ;(result[lesson.track] ||= []).push(lesson)
        return result
      }, {})
      let completedTotal = 0
      document.querySelector("#tracks").innerHTML = Object.entries(groups)
        .map(([track, items]) => {
          const completed = items.filter(
            (item) => readProgress(localStorage, item.id)?.completed,
          ).length
          completedTotal += completed
          const percent = Math.round((completed / items.length) * 100)
          return `<section class="track"><div class="row"><strong>${names[track]}</strong><span>${completed}/${items.length}</span></div><div class="bar" role="progressbar" aria-label="${names[track]}完成进度" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100"><i style="width:${percent}%"></i></div></section>`
        })
        .join("")
      document.querySelector("#total").textContent =
        `共完成 ${completedTotal}/${lessons.length} 个实验`
      window.addEventListener("message", ({ data }) => {
        if (data?.type === "theme")
          document.documentElement.classList.toggle("dark", data.theme === "dark")
      })
    </script>
  </body>
</html>
