<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>784 个数字：电脑眼中的手写数字</title>
<style>
  :root {
    --bg: #faf8f5;
    --canvas-bg: #ffffff;
    --border: #e5e2dc;
    --text: #2b2926;
    --text-sub: #6b675f;
    --cat: #1a6b54;
    --dog: #d97706;
    --line: #4a90d9;
  }
  html.dark {
    --bg: #17191c;
    --canvas-bg: #1e2126;
    --border: #33373d;
    --text: #eceeef;
    --text-sub: #9aa0a8;
    --cat: #4ec9a0;
    --dog: #f59e0b;
    --line: #6aa9e9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 12px;
  }
  .widget {
    max-width: 760px;
    margin: 0 auto;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--canvas-bg);
    overflow: hidden;
  }
  .stage {
    display: flex;
    gap: 16px;
    padding: 16px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  .panel { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .panel-label { font-size: 12.5px; color: var(--text-sub); text-align: center; line-height: 1.5; }
  #drawPad {
    width: 224px; height: 224px;
    border-radius: 10px;
    touch-action: none;
    cursor: crosshair;
    background: #000;
    box-shadow: 0 0 0 1px var(--border);
  }
  .arrow {
    font-size: 26px;
    color: var(--line);
    align-self: center;
    padding-bottom: 28px;
  }
  #zoomGrid {
    width: 224px; height: 224px;
    image-rendering: pixelated;
    border-radius: 10px;
    box-shadow: 0 0 0 1px var(--border);
    background: #000;
  }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    padding: 0 16px 12px;
  }
  button {
    padding: 7px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 13.5px;
    cursor: pointer;
    transition: all .15s ease;
  }
  button:hover { border-color: var(--line); color: var(--line); }
  .primary {
    border: none;
    background: var(--line);
    color: #fff;
    font-weight: 600;
  }
  .primary:hover { opacity: .88; color: #fff; }
  .readout {
    display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-sub);
  }
  .readout b { color: var(--text); font-variant-numeric: tabular-nums; }
  .hint { font-size: 12.5px; line-height: 1.55; max-width: 520px; margin: 0 auto; text-align: center; }
</style>
</head>
<body>
<div class="widget">
  <div class="stage">
    <div class="panel">
      <canvas id="drawPad" width="280" height="280"></canvas>
      <div class="panel-label">① 在这里写一个数字<br>（按住鼠标拖动）</div>
    </div>
    <div class="arrow">→</div>
    <div class="panel">
      <canvas id="zoomGrid" width="224" height="224"></canvas>
      <div class="panel-label">② 电脑看到的：<b>28×28 = 784 个灰度值</b><br>每个小方格是一个 0～1 的数字</div>
    </div>
  </div>
  <div class="toolbar">
    <button id="btnSample" class="primary">🎲 随机画一个示例</button>
    <button id="btnClear">🧽 清空重写</button>
  </div>
  <div class="readout">
    <span>非零格子数：<b id="statActive">0</b></span>
    <span>最亮值：<b id="statMax">0.00</b></span>
    <span>平均亮度：<b id="statAvg">0.000</b></span>
  </div>
  <div class="readout" style="border-top:none; padding-top:0;">
    <span class="hint" id="hintText">💡 这就是神经网络的「输入层」：一张图在它眼里不是画面，而是 784 个排成一列的数字。视频第一章讲的，就是怎么让机器从这串数字里认出答案。</span>
  </div>
</div>

<script>
(function () {
  const pad = document.getElementById("drawPad");
  const pctx = pad.getContext("2d", { willReadFrequently: true });
  const zoom = document.getElementById("zoomGrid");
  const zctx = zoom.getContext("2d");
  const statActive = document.getElementById("statActive");
  const statMax = document.getElementById("statMax");
  const statAvg = document.getElementById("statAvg");
  const N = 28;               // MNIST 标准尺寸
  let CELL = pad.width / N;   // 每个像素格的边长
  let drawing = false;

  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function initPad() {
    pctx.fillStyle = "#000";
    pctx.fillRect(0, 0, pad.width, pad.height);
  }

  // 用「粗圆笔刷」模拟真实笔迹
  function paint(x, y) {
    const g = pctx.createRadialGradient(x, y, 1, x, y, CELL * 1.3);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    pctx.fillStyle = g;
    pctx.beginPath();
    pctx.arc(x, y, CELL * 1.3, 0, Math.PI * 2);
    pctx.fill();
  }

  function getGray(i, j) {
    // 取每个逻辑格中心的亮度 → 0~1
    const px = Math.floor(j * CELL + CELL / 2);
    const py = Math.floor(i * CELL + CELL / 2);
    const d = pctx.getImageData(px, py, 1, 1).data;
    return d[0] / 255;
  }

  function update() {
    const vals = [];
    for (let i = 0; i < N; i++)
      for (let j = 0; j < N; j++)
        vals.push(getGray(i, j));

    // 右侧放大图
    const zc = zoom.width / N;
    zctx.clearRect(0, 0, zoom.width, zoom.height);
    for (let i = 0; i < N; i++) {
      for (let j = 0; j < N; j++) {
        const v = vals[i * N + j];
        zctx.fillStyle = `rgb(${Math.round(v*255)},${Math.round(v*255)},${Math.round(v*255)})`;
        zctx.fillRect(Math.floor(j*zc), Math.floor(i*zc), Math.ceil(zc), Math.ceil(zc));
      }
    }

    // 统计
    const active = vals.filter((v) => v > 0.15).length;
    statActive.textContent = String(active);
    statMax.textContent = Math.max(...vals).toFixed(2);
    statAvg.textContent = (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(3);
  }

  function pos(e) {
    const r = pad.getBoundingClientRect();
    return [(e.clientX - r.left) * (pad.width / r.width),
            (e.clientY - r.top) * (pad.height / r.height)];
  }
  pad.addEventListener("pointerdown", (e) => {
    drawing = true;
    pad.setPointerCapture(e.pointerId);
    const [x, y] = pos(e); paint(x, y); update();
  });
  pad.addEventListener("pointermove", (e) => {
    if (!drawing) return;
    const [x, y] = pos(e); paint(x, y); update();
  });
  window.addEventListener("pointerup", () => { drawing = false; });

  document.getElementById("btnClear").addEventListener("click", () => {
    initPad(); update();
  });

  // 预置一个简单「7」的笔迹（贝塞尔近似）
  document.getElementById("btnSample").addEventListener("click", () => {
    initPad();
    const pts = [];
    for (let t = 0; t <= 20; t++) {
      const u = t / 20;
      pts.push([pad.width*(0.30 + 0.38*u), pad.height*(0.18 + 0.02*u)]);          // 横
    }
    for (let t = 0; t <= 24; t++) {
      const u = t / 24;
      pts.push([pad.width*(0.66 - 0.34*u*u*0.9), pad.height*(0.20 + 0.62*u)]);    // 竖(微斜)
    }
    for (const [x, y] of pts) paint(x, y);
    update();
  });

  // ---------- 深色模式同步 ----------
  function syncTheme() {
    try {
      const attr = window.parent.document.documentElement.getAttribute("saved-theme");
      document.documentElement.classList.toggle("dark", attr === "dark");
    } catch (err) { /* 跨域时静默 */ }
  }
  window.addEventListener("message", (ev) => {
    if (ev.data && ev.data.type === "theme") {
      document.documentElement.classList.toggle("dark", ev.data.theme === "dark");
    }
  });
  setTimeout(syncTheme, 100);

  initPad();
  setTimeout(() => { document.getElementById("btnSample").click(); }, 200);
})();
</script>
</body>
</html>
